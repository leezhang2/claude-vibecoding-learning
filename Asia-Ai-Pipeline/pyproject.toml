[project]
name = "asia-ai-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playsound==1.2.2",
    "requests>=2.34.2",
    "selenium>=4.44.0",
    "anthropic>=0.50.0",
    "python-dotenv>=1.0.0",
    "openai>=2.38.0",
    "json-repair>=0.59.10",
    "pillow>=9.5.0",
    "numpy>=2.4.6",
    "paddleocr>=2.7.0,<3.0.0",
    "paddlepaddle-gpu",
    "setuptools>=82.0.1",
    "iopaint>=1.2.2",
]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu117" }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "paddle-cu117"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu117/"
explicit = true
